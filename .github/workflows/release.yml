name: Release DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      VIDEOBOX_ARCHS: arm64
      VIDEOBOX_FFMPEG_ARCHS: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify tag and app versions match
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(plutil -extract CFBundleShortVersionString raw Packaging/Info.plist)"
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "Tag version $tag_version does not match app version $app_version" >&2
            exit 1
          fi

      - name: Install media runtime build tools
        run: brew install cmake nasm pkgconf

      - name: Cache verified upstream source archives
        uses: actions/cache@v4
        with:
          path: .build/ffmpeg-runtime/downloads
          key: videobox-ffmpeg-sources-${{ hashFiles('Scripts/ffmpeg_versions.sh') }}

      - name: Test
        run: swift test

      - name: Build and verify arm64 DMG
        run: ./Scripts/create_dmg.sh release

      - name: Package corresponding FFmpeg source
        run: ./Scripts/create_ffmpeg_source_archive.sh

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          artifacts=(
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*-ffmpeg-corresponding-source.tar.xz
            dist/*-ffmpeg-corresponding-source.tar.xz.sha256
          )
          notes_path="Documentation/Releases/${GITHUB_REF_NAME}.md"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${artifacts[@]}" --clobber
            exit 0
          fi

          release_arguments=(
            "$GITHUB_REF_NAME"
            "${artifacts[@]}"
            --title "VideoBox $GITHUB_REF_NAME"
          )

          if [[ -f "$notes_path" ]]; then
            release_arguments+=(--notes-file "$notes_path")
          else
            release_arguments+=(--generate-notes)
          fi

          # Keep releases marked as preview until Developer ID signing and
          # Apple notarization are configured for this workflow.
          release_arguments+=(--prerelease)

          gh release create "${release_arguments[@]}"
